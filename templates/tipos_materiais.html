<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Materiais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/design-system.css') }}" rel="stylesheet">
    <style>
        html, body { margin: 0; }
        .page-wrap { max-width: 620px; margin: 0 auto; padding: 2.6rem 1.6rem 3.2rem; font-family: var(--font-sans); color: var(--ink); }

        .mat-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: var(--sp-6); }
        .mat-row {
            position: relative;
            display: flex; align-items: center; gap: 0.8rem;
            background: var(--panel);
            border: 1.5px solid var(--line-strong);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            box-shadow: 0 1px 3px rgba(13, 20, 32, 0.06);
            transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
        }
        .mat-row:hover { border-color: var(--ink-faint); box-shadow: 0 6px 18px rgba(13, 20, 32, 0.1); }
        .mat-row:has(.mat-radio:checked) { border-color: var(--accent); background: var(--accent-soft); }
        .mat-radio { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
        .mat-label { flex: 1; font-size: 0.95rem; font-weight: 500; color: var(--ink); cursor: pointer; }
        .mat-k {
            font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600; color: var(--accent);
            background: var(--accent-soft); padding: 0.2rem 0.55rem; border-radius: var(--radius-sm);
            white-space: nowrap;
        }
        .btns-bottom { display: flex; flex-direction: column; gap: 0.6rem; }
        .btns-bottom .vx-btn { width: 100%; }
    </style>
</head>
<body class="eng-scope-bg">
    <div class="page-wrap">
        <div class="page-head page-head--thermal">
            <div class="page-kicker"><i class="fa-solid fa-layer-group"></i> Materiais · condutividade térmica</div>
            <h1>Escolha o material</h1>
            <p>Selecione o material usado na simulação. A condutividade térmica (k) determina a taxa de condução.</p>
        </div>
        <div class="eng-scale-rule"></div>

        <form method="post">
            <div class="mat-list">
                {% for id, material in materiais.items() %}
                    <div class="mat-row">
                        <input class="mat-radio" type="radio" name="material" value="{{ id }}" id="material{{ id }}" required>
                        <label class="mat-label" for="material{{ id }}">{{ material.nome }}</label>
                        <span class="mat-k">k = {{ material.k }} W/m·K</span>
                    </div>
                {% endfor %}
            </div>
            <div class="btns-bottom">
                <button type="submit" class="vx-btn vx-btn-primary">Próximo <i class="fa-solid fa-arrow-right"></i></button>
                <a href="/" class="vx-btn vx-btn-ghost">Voltar</a>
            </div>
        </form>
    </div>
</body>
</html>
