<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha o Tipo de Aleta</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #e0eafc, #fff 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        header {
            width: 100%;
            background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
            color: #fff;
            padding: 18px 0 12px 0;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px rgba(25, 118, 210, 0.08);
        }
        header h1 {
            margin: 0;
            font-size: 2.3rem;
            letter-spacing: 1px;
        }
        .main-flex {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2.5rem;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .aleta-preview {
            width: 100%;
            max-width: 100vw;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            margin: 0 auto 2.5rem auto;
            background: none;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            min-height: 0;
            gap: 3.2rem;
        }
        .aleta-preview-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .aleta-preview h2 {
            font-size: 1.18rem;
            color: #1976d2;
            margin-bottom: 0.7rem;
            margin-top: 0.5rem;
        }
        .aleta-preview img#aleta_image {
            width: 320px;
            height: 320px;
            object-fit: contain;
            margin-bottom: 0.7rem;
            border-radius: 18px;
            background: #f4f8ff;
            box-shadow: 0 4px 18px #1976d220;
            transition: width 0.3s, height 0.3s;
        }
        .aleta-preview img#formula_image {
            width: 520px;
            max-width: 48vw;
            height: 320px;
            object-fit: contain;
            margin-bottom: 0.5rem;
            border-radius: 14px;
            background: #f4f8ff;
            box-shadow: 0 2px 8px #1976d220;
        }
        .aletas-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.2rem;
            margin-bottom: 2.5rem;
            align-items: flex-start;
        }
        .aleta-card {
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 4px 24px rgba(25, 118, 210, 0.13);
            width: 150px;
            padding: 14px 6px 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.25s, transform 0.22s, border 0.22s;
            border: 2.5px solid transparent;
            position: relative;
            user-select: none;
        }
        .aleta-card.selected {
            border: 2.5px solid #1976d2;
            box-shadow: 0 8px 32px rgba(25, 118, 210, 0.22);
            transform: scale(1.06) translateY(-6px);
            animation: pulse 0.5s;
        }
        .aleta-card:hover {
            box-shadow: 0 12px 36px rgba(25, 118, 210, 0.18);
            transform: scale(1.04) translateY(-2px);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 #1976d2aa; }
            70% { box-shadow: 0 0 0 12px #1976d220; }
            100% { box-shadow: 0 8px 32px rgba(25, 118, 210, 0.22);}
        }
        .aleta-card img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 12px rgba(25, 118, 210, 0.13));
            transition: 
                filter 0.2s, 
                transform 0.2s, 
                width 0.25s, 
                height 0.25s;
            border-radius: 10px;
            background: #f4f8ff;
        }
        .aleta-card.selected img,
        .aleta-card:hover img {
            filter: drop-shadow(0 8px 28px #1976d2bb) brightness(1.08);
            transform: scale(1.18) rotate(-2deg);
            width: 90px;
            height: 90px;
        }
        .aleta-name {
            font-size: 1.02rem;
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 0;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .aleta-checkbox {
            display: none;
        }
        .btns-bottom {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 10px;
        }
        .confirm-btn, .back-btn {
            display: none;
            background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
            color: #fff;
            font-size: 1.18rem;
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 2rem;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.18);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .confirm-btn.show {
            display: block;
            animation: fadeInUp 1s;
        }
        .back-btn {
            display: block;
            background: linear-gradient(90deg, #b0bec5 0%, #90caf9 100%);
            color: #222;
            font-size: 1.1rem;
            padding: 0.7rem 2.2rem;
            margin-right: 0;
            margin-left: 0;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.10);
        }
        .confirm-btn:hover, .confirm-btn:focus {
            background: linear-gradient(90deg, #1565c0 0%, #42a5f5 100%);
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 8px 28px rgba(25, 118, 210, 0.32), 0 1.5px 6px rgba(33,150,243,0.12);
            filter: brightness(1.08) saturate(1.2);
            outline: none;
        }
        .back-btn:hover, .back-btn:focus {
            background: linear-gradient(90deg, #78909c 0%, #90caf9 100%);
            color: #111;
            transform: scale(1.05);
            outline: none;
        }
        @keyframes fadeInUp {
            from {opacity: 0; transform: translateY(40px);}
            to {opacity: 1; transform: translateY(0);}
        }
        @media (max-width: 1100px) {
            .main-flex { flex-direction: column; align-items: center; gap: 1.5rem; }
            .aleta-preview { flex-direction: column; align-items: center; gap: 1.2rem; }
            .aleta-preview img#aleta_image { width: 180px; height: 180px; }
            .aleta-preview img#formula_image { width: 320px; height: 160px; }
        }
        @media (max-width: 900px) {
            .aletas-container { gap: 1.2rem; }
            .aleta-card { width: 44vw; min-width: 100px; }
            .aleta-preview img#aleta_image { width: 120px; height: 120px; }
            .aleta-preview img#formula_image { width: 120px; height: 60px; }
        }
        @media (max-width: 600px) {
            .aleta-card { width: 90vw; min-width: 0; }
            .aleta-card img { width: 40px; height: 40px; }
            .aleta-preview img#aleta_image { width: 70px; height: 70px; }
            .aleta-preview img#formula_image { width: 60px; height: 30px; }
            .aleta-preview { padding: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Escolha o Tipo de Aleta</h1>
    </header>
    <form method="post" action="{{ url_for('sele_materiais') }}">
        <div class="main-flex">
            <div class="aletas-container">
                <label class="aleta-card" data-value="1)aletas retangulares retas">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="1)aletas retangulares retas">
                    <img src="{{ url_for('static', filename='aletas/1.png') }}" alt="Aleta Retangular Reta">
                    <div class="aleta-name">Aletas Retangulares Retas</div>
                </label>
                <label class="aleta-card" data-value="2)aletas triangulares retas">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="2)aletas triangulares retas">
                    <img src="{{ url_for('static', filename='aletas/2.png') }}" alt="Aleta Triangular Reta">
                    <div class="aleta-name">Aletas Triangulares Retas</div>
                </label>
                <label class="aleta-card" data-value="3)aletas parabolicas retas">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="3)aletas parabolicas retas">
                    <img src="{{ url_for('static', filename='aletas/3.png') }}" alt="Aleta Parabólica Reta">
                    <div class="aleta-name">Aletas Parabólicas Retas</div>
                </label>
                <label class="aleta-card" data-value="4)aletas circulares de perfil retangular">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="4)aletas circulares de perfil retangular">
                    <img src="{{ url_for('static', filename='aletas/4.png') }}" alt="Aleta Circular de Perfil Retangular">
                    <div class="aleta-name">Aletas Circulares de Perfil Retangular</div>
                </label>
                <label class="aleta-card" data-value="5)aletas de pino de perfil retangular">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="5)aletas de pino de perfil retangular">
                    <img src="{{ url_for('static', filename='aletas/5.png') }}" alt="Aletas de Pino de Perfil Retangular">
                    <div class="aleta-name">Aletas de Pino de Perfil Retangular</div>
                </label>
                <label class="aleta-card" data-value="6)aletas de perfil triangular">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="6)aletas de perfil triangular">
                    <img src="{{ url_for('static', filename='aletas/6.png') }}" alt="Aleta de Perfil Triangular">
                    <div class="aleta-name">Aletas de Perfil Triangular</div>
                </label>
                <label class="aleta-card" data-value="7)aletas de perfil parabolico">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="7)aletas de perfil parabolico">
                    <img src="{{ url_for('static', filename='aletas/7.png') }}" alt="Aleta de Perfil Parabólico">
                    <div class="aleta-name">Aletas de Perfil Parabólico</div>
                </label>
                <label class="aleta-card" data-value="8)aletas de pino de perfilparabolico (ponta arredondada)">
                    <input type="radio" class="aleta-checkbox" name="sele_aleta" value="8)aletas de pino de perfilparabolico (ponta arredondada)">
                    <img src="{{ url_for('static', filename='aletas/8.png') }}" alt="Aleta de Pino de Perfil Parabólico">
                    <div class="aleta-name">Aletas de Pino de Perfil Parabólico<br>(Ponta Arredondada)</div>
                </label>
            </div>
        </div>
        <div class="aleta-preview" id="aletaPreview" style="display:none;">
            <div class="aleta-preview-col">
                <h2>Imagem da Aleta</h2>
                <img id="aleta_image" src="" alt="Imagem da Aleta">
            </div>
            <div class="aleta-preview-col">
                <h2>Fórmula da Aleta</h2>
                <img id="formula_image" src="" alt="Fórmula da Aleta">
            </div>
        </div>
        <div class="btns-bottom">
            <a href="{{ url_for('index') }}">
                <button type="button" class="back-btn" style="display:block;">Voltar</button>
            </a>
            <button type="submit" class="confirm-btn" id="confirmBtn" style="display:none;">Próximo</button>
        </div>
    </form>
    <script>
        // Seleção visual dos cards (radio)
        document.querySelectorAll('.aleta-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                if (e.target.closest('.back-btn')) return;
                document.querySelectorAll('.aleta-card').forEach(c => {
                    c.classList.remove('selected');
                    c.querySelector('input[type="radio"]').checked = false;
                });
                const checkbox = card.querySelector('input[type="radio"]');
                checkbox.checked = true;
                card.classList.add('selected');
                updateConfirmBtn();
                updatePreview(card.getAttribute('data-value'));
            });
        });

        function updateConfirmBtn() {
            const checked = document.querySelector('.aleta-checkbox:checked');
            const btn = document.getElementById('confirmBtn');
            if (checked) {
                btn.classList.add('show');
                btn.style.display = "block";
            } else {
                btn.classList.remove('show');
                btn.style.display = "none";
            }
        }

        function updatePreview(tipoAleta) {
            const preview = document.getElementById('aletaPreview');
            const aletaImage = document.getElementById('aleta_image');
            const formulaImage = document.getElementById('formula_image');
            const aletaImages = {
                "1)aletas retangulares retas": "{{ url_for('static', filename='aletas/1.png') }}",
                "2)aletas triangulares retas": "{{ url_for('static', filename='aletas/2.png') }}",
                "3)aletas parabolicas retas": "{{ url_for('static', filename='aletas/3.png') }}",
                "4)aletas circulares de perfil retangular": "{{ url_for('static', filename='aletas/4.png') }}",
                "5)aletas de perfil retangular": "{{ url_for('static', filename='aletas/5.png') }}",
                "5)aletas de pino de perfil retangular": "{{ url_for('static', filename='aletas/5.png') }}",
                "6)aletas de perfil triangular": "{{ url_for('static', filename='aletas/6.png') }}",
                "7)aletas de perfil parabolico": "{{ url_for('static', filename='aletas/7.png') }}",
                "8)aletas de pino de perfilparabolico (ponta arredondada)": "{{ url_for('static', filename='aletas/8.png') }}"
            };
            const formulaImages = {
                "1)aletas retangulares retas": "{{ url_for('static', filename='formulas/1.png') }}",
                "2)aletas triangulares retas": "{{ url_for('static', filename='formulas/2.png') }}",
                "3)aletas parabolicas retas": "{{ url_for('static', filename='formulas/3.png') }}",
                "4)aletas circulares de perfil retangular": "{{ url_for('static', filename='formulas/4.png') }}",
                "5)aletas de perfil retangular": "{{ url_for('static', filename='formulas/5.png') }}",
                "5)aletas de pino de perfil retangular": "{{ url_for('static', filename='formulas/5.png') }}",
                "6)aletas de perfil triangular": "{{ url_for('static', filename='formulas/6.png') }}",
                "7)aletas de perfil parabolico": "{{ url_for('static', filename='formulas/7.png') }}",
                "8)aletas de pino de perfilparabolico (ponta arredondada)": "{{ url_for('static', filename='formulas/8.png') }}"
            };
            if (tipoAleta && aletaImages[tipoAleta]) {
                preview.style.display = "flex";
                aletaImage.src = aletaImages[tipoAleta];
                formulaImage.src = formulaImages[tipoAleta];
            } else {
                preview.style.display = "none";
            }
        }

        window.onload = function() {
            // Se já houver seleção, marque visualmente
            const checked = document.querySelector('.aleta-checkbox:checked');
            if (checked) {
                checked.closest('.aleta-card').classList.add('selected');
                updatePreview(checked.closest('.aleta-card').getAttribute('data-value'));
            }
            updateConfirmBtn();
        };
    </script>
</body>
</html>
