<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Aletas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/design-system.css') }}" rel="stylesheet">
    <style>
        html, body { margin: 0; }
        .page-wrap { max-width: 1180px; margin: 0 auto; padding: 2.6rem 2.4rem 3.2rem; font-family: var(--font-sans); color: var(--ink); }

        .aletas-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: var(--sp-5);
            margin-bottom: var(--sp-6);
        }
        .aleta-card {
            position: relative;
            background: var(--panel);
            padding: 1.8rem 1.3rem 1.7rem;
            text-align: center;
            cursor: pointer;
            user-select: none;
            display: block;
            border: 1.5px solid var(--line-strong);
            border-radius: var(--radius-lg);
            box-shadow: 0 1px 3px rgba(13, 20, 32, 0.06);
            transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease),
                        transform var(--dur-fast) var(--ease);
        }
        .aleta-card::before, .aleta-card::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border-color: var(--accent); border-style: solid; border-width: 0;
            opacity: 0; transition: opacity var(--dur-fast) var(--ease);
            pointer-events: none;
        }
        .aleta-card::before { top: 6px; left: 6px; border-top-width: 2px; border-left-width: 2px; }
        .aleta-card::after { bottom: 6px; right: 6px; border-bottom-width: 2px; border-right-width: 2px; }
        .aleta-card:hover::before, .aleta-card:hover::after,
        .aleta-card.selected::before, .aleta-card.selected::after { opacity: 0.85; }
        .aleta-num {
            position: absolute; bottom: 0.6rem; left: 0.7rem;
            font-family: var(--font-mono); font-size: 0.64rem; color: var(--ink-faint); letter-spacing: 0.02em;
        }
        .aleta-check {
            position: absolute; top: 0.6rem; right: 0.6rem;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--accent); color: #fff; font-size: 0.6rem;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: scale(0.5);
            transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
        }
        .aleta-card.selected .aleta-check { opacity: 1; transform: scale(1); }
        .aleta-card:hover {
            border-color: var(--ink-faint);
            box-shadow: 0 8px 24px rgba(13, 20, 32, 0.12);
            transform: translateY(-2px);
        }
        .aleta-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 8px 24px rgba(46, 79, 224, 0.16);
            transform: translateY(-2px);
            animation: aleta-pick var(--dur-slow) var(--ease);
        }
        @keyframes aleta-pick {
            0% { transform: translateY(-2px) scale(1); }
            40% { transform: translateY(-2px) scale(1.045); }
            100% { transform: translateY(-2px) scale(1); }
        }
        .aleta-card img {
            width: 148px; height: 148px; object-fit: contain;
            margin-bottom: 1.1rem; border-radius: var(--radius);
            background: var(--panel-alt);
            transition: transform var(--dur) var(--ease);
        }
        .aleta-card.selected img, .aleta-card:hover img { transform: scale(1.05) translateY(-3px); }
        .aleta-name {
            font-size: 0.98rem; font-weight: 600; color: var(--ink);
            min-height: 40px; display: flex; align-items: center; justify-content: center;
        }
        .aleta-checkbox { display: none; }

        .btns-bottom {
            display: flex; justify-content: flex-start; gap: 0.8rem;
            position: sticky; bottom: 0; background: var(--bg-app);
            padding: 1rem 0 0.2rem;
        }
        .confirm-btn { display: none; }
        .confirm-btn.show { display: inline-flex; animation: vx-rise-in var(--dur-slow) var(--ease) both; }
        @media (prefers-reduced-motion: reduce) {
            .aleta-card.selected { animation: none; }
            .confirm-btn.show { animation: none; }
        }

        @media (max-width: 700px) {
            .page-wrap { padding: 1.8rem 1.2rem 2.4rem; }
            .aletas-container { grid-template-columns: repeat(2, 1fr); gap: var(--sp-3); }
            .aleta-card img { width: 100px; height: 100px; }
        }
    </style>
</head>
<body class="eng-scope-bg">
    <div class="page-wrap">
        <div class="page-head page-head--thermal">
            <div class="page-kicker"><i class="fa-solid fa-shapes"></i> Aletas · 8 geometrias catalogadas</div>
            <h1>Tipos de aleta</h1>
            <p>Escolha uma ou mais geometrias para comparar fórmulas, eficiência e distribuição de temperatura.</p>
        </div>
        <div class="eng-scale-rule"></div>

        <form method="POST" action="{{ url_for('tipos_aletas') }}">
                <div class="aletas-container">
                    <label class="aleta-card" data-value="1)aletas retangulares retas">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="1)aletas retangulares retas">
                        <img src="{{ url_for('static', filename='aletas/1.png') }}" alt="Aleta Retangular Reta">
                        <div class="aleta-name">Retangular reta</div>
                        <span class="aleta-num">01</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="2)aletas triangulares retas">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="2)aletas triangulares retas">
                        <img src="{{ url_for('static', filename='aletas/2.png') }}" alt="Aleta Triangular Reta">
                        <div class="aleta-name">Triangular reta</div>
                        <span class="aleta-num">02</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="3)aletas parabolicas retas">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="3)aletas parabolicas retas">
                        <img src="{{ url_for('static', filename='aletas/3.png') }}" alt="Aleta Parabólica Reta">
                        <div class="aleta-name">Parabólica reta</div>
                        <span class="aleta-num">03</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="4)aletas circulares de perfil retangular">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="4)aletas circulares de perfil retangular">
                        <img src="{{ url_for('static', filename='aletas/4.png') }}" alt="Aleta Circular de Perfil Retangular">
                        <div class="aleta-name">Circular, perfil retangular</div>
                        <span class="aleta-num">04</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="5)aletas de pino de perfil retangular">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="5)aletas de pino de perfil retangular">
                        <img src="{{ url_for('static', filename='aletas/5.png') }}" alt="Aletas de Pino de Perfil Retangular">
                        <div class="aleta-name">Pino, perfil retangular</div>
                        <span class="aleta-num">05</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="6)aletas de perfil triangular">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="6)aletas de perfil triangular">
                        <img src="{{ url_for('static', filename='aletas/6.png') }}" alt="Aleta de Perfil Triangular">
                        <div class="aleta-name">Pino, perfil triangular</div>
                        <span class="aleta-num">06</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="7)aletas de perfil parabolico">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="7)aletas de perfil parabolico">
                        <img src="{{ url_for('static', filename='aletas/7.png') }}" alt="Aleta de Perfil Parabólico">
                        <div class="aleta-name">Pino, perfil parabólico</div>
                        <span class="aleta-num">07</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                    <label class="aleta-card" data-value="8)aletas de pino de perfilparabolico (ponta arredondada)">
                        <input type="checkbox" class="aleta-checkbox" name="tipo_aleta" value="8)aletas de pino de perfilparabolico (ponta arredondada)">
                        <img src="{{ url_for('static', filename='aletas/8.png') }}" alt="Aleta de Pino de Perfil Parabólico">
                        <div class="aleta-name">Pino parabólico, ponta arredondada</div>
                        <span class="aleta-num">08</span>
                        <span class="aleta-check"><i class="fa-solid fa-check"></i></span>
                    </label>
                </div>
            <div class="btns-bottom">
                <a href="{{ url_for('index') }}" class="vx-btn vx-btn-ghost">Voltar</a>
                <button type="submit" class="vx-btn vx-btn-primary confirm-btn" id="confirmBtn">Próximo <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </form>
    </div>

    <script>
        document.querySelectorAll('.aleta-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                if (e.target.closest('.back-btn')) return;
                const checkbox = card.querySelector('input[type="checkbox"]');
                checkbox.checked = !checkbox.checked;
                card.classList.toggle('selected', checkbox.checked);
                updateConfirmBtn();
            });
        });

        function updateConfirmBtn() {
            const anyChecked = document.querySelectorAll('.aleta-checkbox:checked').length > 0;
            const btn = document.getElementById('confirmBtn');
            btn.classList.toggle('show', anyChecked);
        }
        window.onload = function() {
            document.querySelectorAll('.aleta-card').forEach(card => {
                const checkbox = card.querySelector('input[type="checkbox"]');
                card.classList.toggle('selected', checkbox.checked);
            });
            updateConfirmBtn();
        };
    </script>
</body>
</html>
